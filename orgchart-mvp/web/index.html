<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor de organigrama</title>


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos del editor -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Librerías para exportar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js" defer></script>

  <!-- App del editor -->
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Editor de organigrama</h1>
      <p>Construye y ajusta tu estructura organizacional de forma visual.</p>
    </div>

    <div class="shapes-toolbar">
      <div id="shapeList" class="shape-list flex gap-2">
        <div class="shape-item" data-shape-type="classic" draggable="true" title="Arrastrar Rectángulo"></div>
        <div class="shape-item" data-shape-type="circle" draggable="true" title="Arrastrar Círculo"></div>
        <div class="shape-item" data-shape-type="triangle" draggable="true" title="Arrastrar Triángulo"></div>
        <div class="shape-item" data-shape-type="rhombus" draggable="true" title="Arrastrar Rombo"></div>
        <div class="shape-item" data-shape-type="hexagon" draggable="true" title="Arrastrar Hexágono"></div>
      </div>
    </div>

    <div class="toolbar-row">
      <button id="themeToggleBtn" class="flex items-center" title="Cambiar Tema"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" /></svg></button>
      <button id="saveBtn" class="flex items-center bg-brand-600 hover:bg-brand-700 text-white border-transparent" title="Guardar cambios"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 inline-block mr-1"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg> <span>Guardar</span></button>
      <div class="dropdown">
        <button id="exportBtn" class="dropdown-toggle flex items-center"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 inline-block mr-1"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg> <span>Exportar ▼</span></button>
        <div id="exportMenu" class="dropdown-menu">
          <button id="exportHtmlBtn">Regenerar HTML</button>
          <button id="exportPdfBtn">Exportar PDF</button>
          <button id="exportPngBtn">Exportar PNG</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- Panel izquierdo: controles y lista de nodos -->
    <aside class="panel sidebar">
      <h2>Propiedades generales</h2>

      <label>
        <span>Empresa</span>
        <input id="companyInput" type="text" placeholder="Nombre de la empresa">
      </label>

      <label>
        <span>Buscar</span>
        <input id="searchInput" type="text" placeholder="Busca por nombre, cargo o área">
      </label>

      <div id="statsGrid" class="stats-grid"></div>

      <div class="sidebar-section">
        <h3>Edición</h3>
        <div class="button-grid">
          <button id="addRootBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>Raíz</button>
          <button id="autoLayoutBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" /></svg><span class="whitespace-nowrap text-[10px]">Auto layout</span></button>
          <button id="connectModeBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244" /></svg>Conectar</button>
          <button id="undoBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1" title="Deshacer"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" /></svg>Deshacer</button>
          <button id="redoBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1" title="Rehacer"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15 21 9m0 0-6-6M21 9H9a6 6 0 0 0 0 12h3" /></svg>Rehacer</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>Vista</h3>
        <div class="button-grid">
          <button id="centerBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1" title="Centrar vista"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>Centrar</button>
          <button id="fitBtn" class="flex items-center justify-center flex-col text-xs p-2 gap-1" title="Ajustar a la pantalla"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" /></svg>Ajustar</button>
          <button id="zoomInBtn" class="flex items-center justify-center text-xl font-bold" title="Acercar">+</button>
          <button id="zoomOutBtn" class="flex items-center justify-center text-xl font-bold" title="Alejar">−</button>
          <button id="zoomResetBtn" class="flex items-center justify-center text-sm font-medium" title="Zoom original">100%</button>
        </div>
      </div>
      
      <div class="sidebar-section">
        <h3>Datos</h3>
        <div class="button-grid">
          <button id="downloadJsonBtn" class="flex items-center justify-center gap-2 p-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>Descargar</button>
          <label class="import-box">
            <span class="flex items-center justify-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" /></svg>Importar JSON</span>
            <input id="importJsonInput" type="file" accept="application/json">
          </label>
        </div>
      </div>

      <h2>Nodos</h2>
      <div id="nodeList" class="node-list"></div>
    </aside>

    <!-- Panel central: canvas del organigrama -->
    <section class="panel canvas-panel">
      <div class="canvas-toolbar">
        <span id="zoomValue">100%</span>
        <span id="status" class="status info"></span>
      </div>

      <div id="canvasViewport" class="canvas-viewport">
        <div id="chartStage" class="chart-stage"></div>
      </div>
    </section>

    <!-- Panel derecho: inspector -->
    <aside class="panel inspector">
      <h2>Inspector</h2>
      <div id="inspectorContent" class="inspector-fields">
        <p class="empty">Selecciona un nodo o un conector para editarlo.</p>
      </div>
    </aside>
  </main>

  <script>
    // Lógica para el menú desplegable de exportación
    document.addEventListener('DOMContentLoaded', () => {
      const exportBtn = document.getElementById('exportBtn');
      if (!exportBtn) return;

      const dropdown = exportBtn.parentElement;

      exportBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        dropdown.classList.toggle('active');
      });

      document.addEventListener('click', () => {
        if (dropdown.classList.contains('active')) {
          dropdown.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
